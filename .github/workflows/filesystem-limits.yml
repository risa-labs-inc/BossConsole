name: Filesystem resource limits

on:
  # PRs validate dev/develop integration; main pushes validate the merged tree.
  # Do not add dev here: dev -> main would enqueue the same macOS work twice.
  # For a branch without a PR, use workflow_dispatch. See docs/ci-validation.md.
  push:
    branches: [main]
    paths:
      - 'modules/boss-service-filesystem/**'
      - 'modules/boss-ipc/src/main/proto/boss/ipc/v1/services/filesystem.proto'
      - 'plugin-platform/plugin-api-ipc/**'
      - '.github/workflows/filesystem-limits.yml'
  pull_request:
    paths:
      - 'modules/boss-service-filesystem/**'
      - 'modules/boss-ipc/src/main/proto/boss/ipc/v1/services/filesystem.proto'
      - 'plugin-platform/plugin-api-ipc/**'
      - '.github/workflows/filesystem-limits.yml'
  workflow_dispatch:

# Cancel only obsolete PR validation; never cancel main or manual validation.
concurrency:
  group: filesystem-limits-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run on PRs into main, pushes to main and manual runs.
        # PRs that don't target main skip them: hosted macOS and Windows runners
        # run few jobs at once.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-latest", "ubuntu-24.04-arm"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run filesystem and paging regressions
        shell: bash
        run: ./gradlew :boss-service-filesystem:test :plugin-platform:plugin-api-ipc:desktopTest :boss-service-filesystem:ktlintCheck :boss-service-filesystem:detekt :plugin-platform:plugin-api-ipc:ktlintCheck :plugin-platform:plugin-api-ipc:detekt --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: filesystem-limits-${{ matrix.os }}
          path: |
            modules/boss-service-filesystem/build/test-results
            plugin-platform/plugin-api-ipc/build/test-results
