name: Native file boundaries

on:
  push:
    # Match the main build: PR merge trees cover feature branches, and pushes
    # cover integration branches. Avoid two five-job matrices per PR update.
    branches: [main, develop, dev]
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - '.github/workflows/native-file-boundaries.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - '.github/workflows/native-file-boundaries.yml'
  workflow_dispatch:

concurrency:
  group: native-file-boundaries-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run JVM file and process regressions
        shell: bash
        run: >-
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm
          :boss-process-manager:test :boss-process-manager:ktlintCheck :boss-process-manager:detekt
          :boss-native-files:ktlintCheck :boss-native-files:detekt
          --console=plain --no-daemon
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.0'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile the native file boundary smoke binary
        shell: bash
        run: ./gradlew :boss-native-files:nativeCompile --console=plain --no-daemon
      - name: Execute the native file boundary smoke binary
        shell: bash
        run: ./modules/boss-native-files/build/native/nativeCompile/native-files-smoke
      - name: Save test and native build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-file-boundaries-${{ matrix.os }}
          path: |
            modules/boss-native-files/build/reports/
            modules/boss-native-files/build/test-results/
            modules/boss-process-manager/build/test-results/
          retention-days: 7

  old-glibc:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: eclipse-temurin:17-jdk-focal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the pre-2.33 glibc stat ABI
        shell: bash
        run: |
          ldd --version
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm :boss-process-manager:test --console=plain --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-file-boundaries-glibc-2.31-${{ matrix.runner }}
          path: modules/boss-native-files/build/test-results/
