name: Native file boundaries

on:
  # PRs validate dev/develop integration; main pushes validate the merged tree.
  # Do not add dev here: dev -> main would enqueue the same macOS work twice.
  # For a branch without a PR, use workflow_dispatch. See docs/ci-validation.md.
  push:
    branches: [main]
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - '.github/workflows/native-file-boundaries.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - '.github/workflows/native-file-boundaries.yml'
  workflow_dispatch:

concurrency:
  group: native-file-boundaries-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on PRs into main, pushes to main and manual runs. PRs that
        # don't target main skip macOS: hosted macOS runs few jobs at once.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM file and process regressions
        shell: bash
        run: >-
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm
          :boss-process-manager:test :boss-process-manager:ktlintCheck :boss-process-manager:detekt
          :boss-native-files:ktlintCheck :boss-native-files:detekt
          --console=plain --no-daemon
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile the native file boundary smoke binary
        shell: bash
        run: ./gradlew :boss-native-files:nativeCompile --console=plain --no-daemon
      - name: Execute the native file boundary smoke binary
        shell: bash
        run: ./modules/boss-native-files/build/native/nativeCompile/native-files-smoke
      - name: Save test and native build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-file-boundaries-${{ matrix.os }}
          path: |
            modules/boss-native-files/build/reports/
            modules/boss-native-files/build/test-results/
            modules/boss-process-manager/build/test-results/
          retention-days: 7

  old-glibc:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: eclipse-temurin:17-jdk-focal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify the pre-2.33 glibc stat ABI
        shell: bash
        run: |
          ldd --version
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm :boss-process-manager:test --console=plain --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-file-boundaries-glibc-2.31-${{ matrix.runner }}
          path: modules/boss-native-files/build/test-results/
