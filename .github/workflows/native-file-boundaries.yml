name: Native file boundaries

on:
  push:
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - 'modules/boss-service-filesystem/**'
      - 'modules/boss-app-terminal/**'
      - '.github/workflows/native-file-boundaries.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'modules/boss-native-files/**'
      - 'modules/boss-process-manager/**'
      - 'modules/boss-service-filesystem/**'
      - 'modules/boss-app-terminal/**'
      - '.github/workflows/native-file-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Create a disposable second filesystem on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -size 64m -fs APFS -volname boss-filesystem-test "$RUNNER_TEMP/boss-filesystem-test.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/boss-filesystem-volume" "$RUNNER_TEMP/boss-filesystem-test.dmg"
          echo "BOSS_TEST_SECOND_VOLUME=$RUNNER_TEMP/boss-filesystem-volume" >> "$GITHUB_ENV"
      - name: Run JVM file and process regressions
        shell: bash
        run: >-
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm
          :boss-process-manager:test :boss-app-terminal:test :boss-service-filesystem:test
          :boss-native-files:ktlintCheck :boss-native-files:detekt
          --console=plain --no-daemon
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile the native file boundary smoke binary
        shell: bash
        run: ./gradlew :boss-native-files:nativeCompile --console=plain --no-daemon
      - name: Execute the native file boundary smoke binary
        shell: bash
        run: ./modules/boss-native-files/build/native/nativeCompile/native-files-smoke
      - name: Remove the disposable second filesystem
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/boss-filesystem-volume" ]; then
            hdiutil detach "$RUNNER_TEMP/boss-filesystem-volume"
          fi
          rm -f "$RUNNER_TEMP/boss-filesystem-test.dmg"
      - name: Save test and native build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-file-boundaries-${{ matrix.os }}
          path: |
            modules/boss-native-files/build/reports/
            modules/boss-native-files/build/test-results/
            modules/boss-process-manager/build/test-results/
            modules/boss-app-terminal/build/test-results/
            modules/boss-service-filesystem/build/test-results/
          retention-days: 7

  old-glibc:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: eclipse-temurin:17-jdk-focal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify the pre-2.33 glibc stat ABI
        shell: bash
        run: |
          ldd --version
          ./gradlew :boss-native-files:test :boss-native-files:nativeSmokeJvm --console=plain --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-file-boundaries-glibc-2.31-${{ matrix.runner }}
          path: modules/boss-native-files/build/test-results/
