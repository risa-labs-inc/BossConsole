name: Native application capture

on:
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'native/app-capture/**'
      - 'scripts/build-app-capture.py'
      - 'scripts/test/test-app-capture-xwayland.py'
      - '.github/workflows/app-capture-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/app-capture/**'
      - 'scripts/build-app-capture.py'
      - 'scripts/test/test-app-capture-xwayland.py'
  workflow_dispatch:
    inputs:
      windows_capture:
        description: 'Probe hosted Windows capture and run the synthetic owned-window fixture when supported'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install X11 capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libx11-dev libxcomposite-dev libxres-dev libxdamage-dev libxrender-dev libsystemd-dev xvfb xauth weston xwayland openjdk-17-jdk
      - name: Build packaged capture helper
        run: python scripts/build-app-capture.py --source native/app-capture --build native/app-capture/build --output native/app-capture/build/resource
      - name: Verify exact X11 pixels and lifecycle
        if: runner.os == 'Linux'
        run: |
          cmake -S native/app-capture -B native/app-capture/build -DBUILD_TESTING=ON
          cmake --build native/app-capture/build --parallel 2
          xvfb-run -a ctest --test-dir native/app-capture/build --output-on-failure
      - name: Verify real JDK geometry under XWayland
        if: runner.os == 'Linux'
        run: |
          export PATH="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)/bin:$PATH"
          python scripts/test/test-app-capture-xwayland.py --test-binary native/app-capture/build/boss-app-capture-test --awt-probe native/app-capture/AwtGeometryProbe.java --compositor-scale 1
          python scripts/test/test-app-capture-xwayland.py --test-binary native/app-capture/build/boss-app-capture-test --awt-probe native/app-capture/AwtGeometryProbe.java --compositor-scale 2
      - name: Compile Windows native fixture and run noninteractive boundaries
        if: runner.os == 'Windows'
        run: |
          cmake -S native/app-capture -B native/app-capture/build -DBUILD_TESTING=ON
          cmake --build native/app-capture/build --config Release --parallel 2
          ctest --test-dir native/app-capture/build -C Release --output-on-failure
      - name: Probe manual Windows capture prerequisites
        id: windows_runtime_probe
        if: github.event_name == 'workflow_dispatch' && inputs.windows_capture && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $report = 'native/app-capture/build/windows-runtime-capabilities.txt'
          "Process session: $((Get-Process -Id $PID).SessionId)" | Tee-Object -FilePath $report
          "UserInteractive: $([Environment]::UserInteractive)" | Tee-Object -FilePath $report -Append
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, ProductType | Format-List | Out-String | Tee-Object -FilePath $report -Append
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterCompatibility, DriverVersion | Format-List | Out-String | Tee-Object -FilePath $report -Append
          & native/app-capture/build/Release/boss-app-capture.exe --probe $PID 2>&1 | Tee-Object -FilePath $report -Append
          $probeExit = $LASTEXITCODE
          "Production capability probe exit: $probeExit" | Tee-Object -FilePath $report -Append
          if ($probeExit -eq 0) {
            'supported=true' >> $env:GITHUB_OUTPUT
            'Windows session/WGC probe passed; synthetic capture fixture will run.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'supported=false' >> $env:GITHUB_OUTPUT
            'Windows runtime capture NOT ATTEMPTED: the production session/WGC capability probe rejected this runner. This is not capture validation.' >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Run manual Windows owned-window capture fixture
        if: github.event_name == 'workflow_dispatch' && inputs.windows_capture && runner.os == 'Windows' && steps.windows_runtime_probe.outputs.supported == 'true'
        timeout-minutes: 2
        shell: pwsh
        env:
          BOSS_TEST_WINDOWS_CAPTURE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $report = Join-Path $PWD 'native/app-capture/build/windows-runtime.xml'
          ctest --test-dir native/app-capture/build -C Release -R '^exact-windows-window$' --timeout 60 --no-tests=error --output-on-failure --output-junit $report
          $testExit = $LASTEXITCODE
          if ($testExit -eq 0) {
            'Synthetic exact-window capture fixture PASSED. This validates this runner and source fixture, not physical GPU performance or actual BossConsole input.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Synthetic exact-window capture fixture FAILED (exit $testExit); inspect runtime artifacts." >> $env:GITHUB_STEP_SUMMARY
          }
          exit $testExit
      - name: Preserve manual Windows runtime evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.windows_capture && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-capture-runtime-${{ matrix.os }}
          path: |
            native/app-capture/build/windows-runtime-capabilities.txt
            native/app-capture/build/windows-runtime.xml
            native/app-capture/build/Testing/Temporary/LastTest.log
          retention-days: 7
      - name: Reject malformed capture invocation
        shell: bash
        run: |
          helper=native/app-capture/build/resource/boss-app-capture
          if [[ "$RUNNER_OS" == Windows ]]; then helper="$helper.exe"; fi
          if "$helper"; then
            echo 'Invalid invocation unexpectedly admitted'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: app-capture-${{ matrix.os }}
          path: native/app-capture/build/resource/
          retention-days: 7
