syntax = "proto3";

package boss.ipc.v1;

import "boss/ipc/v1/common.proto";

option java_package = "ai.rever.boss.ipc.proto";
option java_multiple_files = true;

// PluginUIService enables out-of-process plugins to render UI in the kernel's Compose window.
// Plugins send declarative widget trees; the kernel renders them as Compose components.
// User events flow back from kernel to plugin for handling.
//
// The PLUGIN is the client here and the KERNEL is the server, in both directions: a plugin dials the
// kernel, streams WidgetUpdates up, and reads UIEvents back down off the same call. A host that
// implements this as a client of the plugin cannot work — the request stream is typed WidgetUpdate, so
// there is nowhere to put an outgoing event.
service PluginUIService {
  // Register a UI surface (panel or tab) with the kernel.
  //
  // Every UI call carries boss-process-token metadata minted for the child at spawn.
  // The kernel derives process identity from that token, not from process_id in the body.
  // Surface names remain reserved for that stable identity for the host registry lifetime,
  // including disconnects, unregisters and kernel restarts while host components may remain.
  //
  // Required before StreamUI. A surface_id already held by a *different* process is refused, with the
  // holder named in error_message. A surface_id held by the SAME process with no stream open is taken
  // over, which is what a respawn after a crash looks like.
  //
  // That reclaim rule compares process_id as a string, so process_id must be STABLE FOR A PLUGIN ACROSS
  // RESTARTS — an identity for the plugin, not for the OS process. A pid or a per-launch UUID silently
  // costs a plugin its own surfaces: crash in the window between RegisterUI and StreamUI and the id is
  // refused for the rest of the session, with no error to point at.
  rpc RegisterUI(UIRegistration) returns (UIRegistrationResponse);

  // Bidirectional stream: plugin sends widget updates, kernel sends user events.
  //
  // The call carries no surface id of its own, so it is bound to the surface_id of its FIRST
  // WidgetUpdate and pinned to it for its lifetime — send one (normally the full tree) to open the
  // stream, or the call fails with INVALID_ARGUMENT when the request stream ends. Later updates for a
  // different surface_id are ignored; use one call per surface.
  //
  // The first update is the only attempt at binding, and the status says what to do about it:
  //   PERMISSION_DENIED    the authenticated process does not own this surface
  //   NOT_FOUND            the surface_id is not registered — call RegisterUI, then open a NEW StreamUI
  //                        (later updates on this call are ignored, so retrying on it will not work)
  //   FAILED_PRECONDITION  another call already streams that surface, and always will
  //   INVALID_ARGUMENT     the request stream ended without ever sending a WidgetUpdate
  //   DEADLINE_EXCEEDED    the call sent nothing and did not half-close, so it was reaped
  //
  // The two directions are independent. Half-closing the request stream is fine and keeps receiving
  // events. But the call ENDING — cancelled, dropped, or the process dying — also unregisters the
  // surface, since a dead stream is the only notice the kernel gets that a plugin is gone; reopening
  // therefore needs a fresh RegisterUI.
  //
  // Events raised while a surface is registered but not yet streaming are buffered, and the buffer is
  // bounded (256 events). Past that the kernel sheds from the HEAD, keeping the newest: TextChangeEvent
  // carries a whole field value with last-write-wins semantics, so the newest is the one that must
  // survive. A plugin that stops reading loses its oldest events, not its current state.
  rpc StreamUI(stream WidgetUpdate) returns (stream UIEvent);

  // Unregister a UI surface. Completes any open StreamUI call for it.
  rpc UnregisterUI(UIUnregistration) returns (Empty);
}

// ---- UI Registration ----

message UIRegistration {
  string surface_id = 1;       // Unique ID for this UI surface
  string surface_type = 2;     // "panel" or "tab"
  string display_name = 3;
  string icon_name = 4;        // Icon identifier
  string process_id = 5;
  // Initial widget tree
  WidgetTree initial_tree = 6;
  // For panels: default slot position
  string default_slot = 7;     // e.g., "left.top.top", "right.top.bottom"

  // Opt in to unclaimed KeyEvent delivery while an interactive child holds focus.
  // False by default, including registrations from older plugins that omit this field.
  // This is wire-compatible but changes behavior: older plugins must opt in to retain raw
  // key delivery. Neither value makes the surface root a focus target. Widget events such as
  // TextChange still work without this flag. This is a plugin declaration, not user consent;
  // it does not add a permission prompt or protect against a plugin deliberately opting in.
  bool wants_keys = 8;
}

message UIRegistrationResponse {
  bool success = 1;
  string error_message = 2;
}

message UIUnregistration {
  string surface_id = 1;
}

// ---- Widget Tree ----

message WidgetTree {
  string root_id = 1;
  repeated WidgetNode nodes = 2;
  int64 version = 3;  // Incremented on every update for diff tracking
}

message WidgetNode {
  // Node identity. Renderers key per-node state (text-field buffers, scroll
  // offsets) on this, and WidgetDiff operations address nodes by it, so senders
  // must keep ids STABLE across rebuilds of the same logical widget. Freshly
  // random ids per build turn every update into remove-all/add-all and discard
  // whatever the user was typing.
  string id = 1;

  WidgetType type = 2;

  // Type-specific properties (all values as strings). Notable keys:
  //   BUTTON:      "label", "clickEventId" (also accepted: "onClickEvent")
  //   TEXT:        "value", "fontSize", "style"
  //   TEXT_FIELD:  "value", "placeholder", "onChangeEvent"
  //   CHECKBOX /
  //   TOGGLE:      "checked", "label", "onToggleEvent"
  //   DROPDOWN:    "selected", "options" (comma-joined), "onSelectEvent"
  //   LIST:        "items" (comma-joined rows, used when child_ids is empty)
  //   ICON:        "name", "size"
  //   PROGRESS:    "value", "indeterminate"
  //   SPACER:      "height"
  //
  // Comma-joined values ("options", "items") split on ',' with NO escaping and
  // NO trimming: "Buy milk, eggs" is two entries, the second " eggs". Send
  // values that may contain a comma as child nodes instead. An absent or empty
  // property means zero entries; "a,,b" is three entries with a blank middle
  // one. Boolean values follow Kotlin's String.toBoolean: case-insensitive
  // "true", everything else false.
  //
  // A widget's local state (a text field's buffer, a checkbox's flag) is seeded
  // from these properties and thereafter owned by the user — but a NEW value on
  // an update replaces it, which is how a plugin clears a field after submit or
  // pushes back a normalized/rejected value. Re-sending an unchanged value does
  // not disturb in-flight editing.
  map<string, string> properties = 3;

  repeated string child_ids = 4;         // Ordered child node IDs
  WidgetModifier modifier = 5;           // Layout/style modifiers
}

enum WidgetType {
  WIDGET_TYPE_UNSPECIFIED = 0;
  // Layout
  WIDGET_TYPE_COLUMN = 1;
  WIDGET_TYPE_ROW = 2;
  WIDGET_TYPE_BOX = 3;
  WIDGET_TYPE_SCROLL = 4;
  // Content
  WIDGET_TYPE_TEXT = 10;
  WIDGET_TYPE_ICON = 11;
  WIDGET_TYPE_IMAGE = 12;
  WIDGET_TYPE_DIVIDER = 13;
  WIDGET_TYPE_SPACER = 14;
  WIDGET_TYPE_PROGRESS = 15;
  // Interactive
  WIDGET_TYPE_BUTTON = 20;
  WIDGET_TYPE_TEXT_FIELD = 21;
  WIDGET_TYPE_CHECKBOX = 22;
  WIDGET_TYPE_DROPDOWN = 23;
  WIDGET_TYPE_TOGGLE = 24;
  // Collections
  WIDGET_TYPE_LIST = 30;
  WIDGET_TYPE_TREE = 31;
  WIDGET_TYPE_TABLE = 32;
  WIDGET_TYPE_TAB_ROW = 33;
  // Special composites (mapped to host Compose components)
  WIDGET_TYPE_CODE_EDITOR = 100;
  WIDGET_TYPE_TERMINAL = 101;
  WIDGET_TYPE_BROWSER = 102;
  // Canvas for custom drawing
  WIDGET_TYPE_CANVAS = 110;
}

message WidgetModifier {
  int32 width = 1;         // 0 = wrap content, -1 = fill max
  int32 height = 2;
  int32 padding_start = 3;
  int32 padding_top = 4;
  int32 padding_end = 5;
  int32 padding_bottom = 6;

  // Hex color ("#RRGGBB" / "#AARRGGBB") or a design-system theme token resolved
  // against the host's ACTIVE theme, so the widget re-skins with the app:
  // ink, panel, raised, line, lineStrong, textPrimary, textSecondary,
  // textMuted, signal, signalDim, signalWash, signalText, data, ok, warn,
  // alert, onSignal, onData. Note this field is a BACKGROUND, so `signal` is
  // the one you want for an accent fill; `signalText` is the text-contrast
  // variant and only makes sense as a foreground.
  // Token names are matched case-insensitively, ignoring '_' and '-'.
  // Empty, or anything that is neither a token nor valid hex: no background.
  string background_color = 7;

  // Opacity 0.0-1.0. NOTE: 0.0 means "unset", NOT "invisible". proto3 has no
  // presence for scalars, so a sender that never touches this field sends 0.0;
  // honouring that literally would make every widget from every such plugin
  // disappear. Renderers apply the value only when it lies strictly inside
  // (0.0, 1.0). A widget that should not be visible must not be sent.
  float alpha = 8;

  bool clickable = 9;
  string click_event_id = 10;   // Event ID sent back on click
}

// ---- Widget Diff (incremental updates) ----

message WidgetUpdate {
  string surface_id = 1;

  oneof update {
    WidgetTree full_tree = 2;   // Full tree replacement
    WidgetDiff diff = 3;        // Incremental diff
  }
}

message WidgetDiff {
  int64 base_version = 1;
  int64 new_version = 2;
  repeated DiffOperation operations = 3;
}

message DiffOperation {
  oneof op {
    NodeAdded added = 1;
    NodeRemoved removed = 2;
    NodeUpdated updated = 3;
    NodeMoved moved = 4;
  }
}

message NodeAdded {
  WidgetNode node = 1;
  string parent_id = 2;
  int32 index = 3;  // Position within parent's children
}

message NodeRemoved {
  string node_id = 1;
}

message NodeUpdated {
  string node_id = 1;
  map<string, string> changed_properties = 2;
  WidgetModifier modifier = 3;  // Updated modifier (null = no change)
}

message NodeMoved {
  string node_id = 1;
  string new_parent_id = 2;
  int32 new_index = 3;
}

// ---- UI Events (kernel -> plugin) ----

message UIEvent {
  string surface_id = 1;
  string target_node_id = 2;
  int64 timestamp = 3;

  oneof event {
    ClickEvent click = 4;
    TextChangeEvent text_change = 5;
    SelectionEvent selection = 6;
    KeyEvent key = 7;
    ScrollEvent scroll = 8;
    FocusEvent focus = 9;
    ToggleEvent toggle = 10;
    LifecycleEvent lifecycle = 11;
  }
}

message ClickEvent {
  string event_id = 1;  // Custom event ID from widget properties
}

message TextChangeEvent {
  string new_value = 1;
}

message SelectionEvent {
  string selected_value = 1;
  int32 selected_index = 2;
}

// A key press the surface received and nothing claimed.
//
// The kernel keymap always wins: a key bound to a host shortcut is consumed before the surface sees
// it and is never forwarded, so a plugin cannot swallow a window/tab/split binding. What arrives here
// is what the host declined AND the focused widget declined: events travel UP from the focus target,
// so a widget that handles a key keeps it. Typing into a text field therefore produces TextChangeEvent
// rather than one KeyEvent per character — but note the boundary is "the focused widget consumed it",
// so keys a widget ignores (function keys, unhandled chords) do reach the plugin while it has focus.
//
// Key DOWN only; there is no up/down discriminator here, so both edges would read as two presses. A
// modifier pressed on its own is not sent — it arrives as a flag on the key it qualifies.
// target_node_id is empty: no node claimed the press, so there is none to attribute it to.
//
// UNTHROTTLED, unlike ScrollEvent: a key held down produces one of these per OS auto-repeat tick
// (~25-30/s). Plugins should not treat the rate as bounded, and should not do per-event work that
// assumes it is.
message KeyEvent {
  int32 key_code = 1;  // Platform key code (the AWT VK_ constant on the JVM host)
  bool ctrl = 2;
  bool alt = 3;
  bool shift = 4;
  bool meta = 5;
}

// A scroll movement, coalesced.
//
// Deltas, not positions. A conforming host coalesces them before they reach the transport — the
// transport itself enforces nothing — to at most one event per ~60ms per scrolling NODE, with the
// remainder always flushed when the gesture stops. A surface with several scroll containers therefore
// produces that rate per container. The invariant a plugin may rely on is that the deltas SUM to the
// total displacement: accumulate them and you are never out of step with the screen, you just learn
// about the middle of a fling in fewer, larger steps. One event per frame would be ~60 IPC messages
// per second per scrolling node.
//
// The sum holds across one surface's continuous scroll reporting. Treat a surface teardown or a tree
// update that replaces the scrolling node as a RESET of the accumulator: the host re-seeds its baseline
// from wherever the new node starts, and a delta bridging the two would be meaningless.
//
// Units are layout pixels, not density-independent units.
//
// The JVM host currently reports these for WIDGET_TYPE_SCROLL nodes only, and vertically only, so
// delta_x is always 0 there. WIDGET_TYPE_LIST does not yet report its own scrolling.
message ScrollEvent {
  float delta_x = 1;
  float delta_y = 2;
}

message FocusEvent {
  bool has_focus = 1;
}

message ToggleEvent {
  bool checked = 1;
}

// A transition in the surface's RENDERED lifetime.
//
// "created" means a host renderer is attached and this stream is live — the widgets are on screen.
// "destroyed" means that stopped being true. They are enqueued as a matched pair: the kernel never
// queues "destroyed" without having queued "created", and never queues either twice in a row. A
// plugin that crashes and respawns under a component that stayed open is told "created" again.
//
// Pairing is guaranteed at enqueue, not at delivery. A plugin that stops reading its event stream long
// enough for the kernel to start shedding (see the surface event buffer) can lose its "created", since
// it is the oldest event on the queue, and then see a "destroyed" on its own. Handle an unmatched
// "destroyed" as a teardown rather than as a protocol error.
//
// "destroyed" is delivered on every teardown that still has a transport (the component detaching,
// the plugin's own UnregisterUI, kernel shutdown) and is enqueued BEFORE the stream closes, so it
// arrives as the last event. The one case it cannot be delivered is a stream that already died — a
// crashed process — where the response stream simply completing is the notice.
//
// "resumed"/"paused" are reserved and not currently emitted. Unknown states must be ignored, not
// rejected: the field stays a string so a newer kernel can add one without breaking older plugins.
// target_node_id is empty — a lifecycle transition belongs to the surface, not to a node.
message LifecycleEvent {
  string lifecycle_state = 1;  // "created", "resumed", "paused", "destroyed"
}
