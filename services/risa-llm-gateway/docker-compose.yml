services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: risa-llm-litellm:local
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      CW_API_TOKEN: ${CW_API_TOKEN}
      CW_INFERENCE_BASE_URL: ${CW_INFERENCE_BASE_URL}
      CW_SERVED_MODEL: ${CW_SERVED_MODEL}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: .
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      GATEWAY_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/risa_llm_gateway
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RISA_LLM_EMAIL_DOMAIN: risalabs.ai
      RISA_LLM_MODEL: coreweave-glm-5-2
      RISA_LLM_KEY_DURATION: ${RISA_LLM_KEY_DURATION:-8h}
      RISA_LLM_KEY_REFRESH_SECONDS: ${RISA_LLM_KEY_REFRESH_SECONDS:-21600}
      RISA_LLM_RPM_LIMIT: ${RISA_LLM_RPM_LIMIT:-60}
      RISA_LLM_TPM_LIMIT: ${RISA_LLM_TPM_LIMIT:-500000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started

volumes:
  litellm-postgres:
