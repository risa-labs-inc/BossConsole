substitutions:
  _REGION: us-central1
  _REPOSITORY: risa-llm
  _IMAGE_TAG: dev

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gateway:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.litellm
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/litellm:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gateway:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/litellm:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
