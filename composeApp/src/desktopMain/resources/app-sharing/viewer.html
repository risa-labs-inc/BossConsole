<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Remote BossConsole</title><link rel="icon" type="image/svg+xml" href="./boss-logo.svg"><link rel="stylesheet" href="./viewer.css"></head>
<body>
  <main><video id="screen" autoplay playsinline muted tabindex="0" aria-label="Shared BossConsole window"></video><div id="placeholder"><img src="./boss-logo.svg" width="112" height="112" alt="Boss"><p id="placeholder-status">Open a shared session from your BossConsole account.</p></div></main>
  <footer><label id="window-label" hidden>Window <select id="window" aria-label="Shared BossConsole window"></select></label><span id="status" role="status" aria-live="polite">Open a shared session from your BossConsole account.</span><div id="performance" role="group" aria-label="Sharing performance"><span id="resolution" title="Received video resolution">-</span><span id="client-metrics" data-quality="unknown">Client Unknown · - fps · ↓ - · relay - ms</span><span id="remote-metrics" data-quality="unknown">Remote Unknown · - fps · ↑ - · relay - ms</span></div><label id="window-actions-label" hidden><select id="window-actions" aria-label="Remote window actions" disabled><option value="">Window actions</option></select></label><button id="control" disabled>Take control</button><button id="fullscreen" aria-pressed="false">Fullscreen</button><button id="disconnect">Disconnect</button></footer>
  <script type="module" src="./viewer.mjs"></script>
</body></html>
