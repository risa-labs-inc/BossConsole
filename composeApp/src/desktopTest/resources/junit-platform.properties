# Fail a test run on a test JUnit will not execute, such as a @Test method that returns a value
# (`fun x() = runBlocking { ... }`), which JUnit otherwise skips with a warning while the build
# stays green. The root build.gradle.kts sets the same property for every module's Gradle test
# task; this file makes an IDE run of composeApp's tests meet it too. See AGENTS.md.
junit.platform.discovery.issue.severity.critical=WARNING
